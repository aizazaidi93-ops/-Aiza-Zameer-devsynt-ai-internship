<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retail Sales Dashboard</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f3f4f6;
        margin: 0;
        padding: 30px;
    }
    h1 {
        text-align: center;
        color: #1e293b;
    }
    .cards {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 40px;
    }
    .card {
        background: white;
        border-radius: 10px;
        padding: 20px 30px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        text-align: center;
        min-width: 180px;
    }
    .card h2 {
        margin: 0;
        color: #3b82f6;
        font-size: 24px;
    }
    .card p {
        margin: 5px 0 0;
        color: #555;
    }
    .charts {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
    }
    .charts img {
        width: 400px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
</style>
</head>
<body>

<h1>📊 Retail Sales Dashboard</h1>

<div class="cards">
    <div class="card">
        <h2>₹956,508.86</h2>
        <p>Total Sales</p>
    </div>
    <div class="card">
        <h2>850</h2>
        <p>Total Orders</p>
    </div>
    <div class="card">
        <h2>₹1,125.30</h2>
        <p>Average Order Value</p>
    </div>
    <div class="card">
        <h2>Laptop</h2>
        <p>Best-Selling Product</p>
    </div>
</div>

<div class="charts">
    <img src="../assets/top_products.png" alt="Top Products">
    <img src="../assets/sales_by_region.png" alt="Sales by Region">
    <img src="../assets/sales_by_category.png" alt="Sales by Category">
</div>

</body>
</html>
